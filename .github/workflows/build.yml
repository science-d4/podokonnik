name: Build, test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: bash Scripts/test.sh
      - name: Test release ordering
        run: python3 Tests/ReleaseVersionTests.py
      - name: Build application
        run: bash Scripts/build.sh

  release:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: podokonnik-release
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: version
        run: python3 Scripts/select-release-version.py
      - name: Build release application
        if: steps.version.outputs.publish == 'true'
        env:
          PODOKONNIK_VERSION: ${{ steps.version.outputs.version }}
        run: bash Scripts/build.sh
      - name: Package release
        if: steps.version.outputs.publish == 'true'
        run: bash Scripts/package-dmg.sh
      - name: Sign update feed
        if: steps.version.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Scripts/create-appcast.sh
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.version.outputs.existing }}
        run: |
          if [[ "$TAG_EXISTS" == false ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" == false ]]; then
              echo "Release $RELEASE_TAG already exists."
              exit 0
            fi
            echo "Draft release $RELEASE_TAG exists; finish or remove it before retrying." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Podokonnik-$RELEASE_VERSION-arm64.dmg" \
            "dist/Podokonnik-$RELEASE_VERSION-arm64.dmg.sha256" \
            "dist/appcast.xml" \
            --verify-tag --title "Podokonnik $RELEASE_VERSION" --generate-notes
