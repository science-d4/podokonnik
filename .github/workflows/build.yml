name: Build, test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: bash Scripts/test.sh
      - name: Build application
        run: bash Scripts/build.sh

  release:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: podokonnik-release
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          pattern = re.compile(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)')
          baseline = subprocess.check_output(['/usr/libexec/PlistBuddy', '-c', 'Print :CFBundleShortVersionString', 'Resources/Info.plist'], text=True).strip()
          if not pattern.fullmatch('v' + baseline):
              raise SystemExit(f'Invalid baseline version: {baseline}')
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          current_tags = set(subprocess.check_output(['git', 'tag', '--points-at', os.environ['GITHUB_SHA']], text=True).splitlines())
          matching = sorted(tag for tag in current_tags if pattern.fullmatch(tag))
          if len(matching) > 1:
              raise SystemExit('Multiple version tags point to this commit; resolve manually.')
          if matching:
              tag = matching[0]
          else:
              versions = [tuple(map(int, baseline.split('.')))]
              versions.extend(tuple(map(int, match.groups())) for tag in tags if (match := pattern.fullmatch(tag)))
              major, minor, patch = max(versions)
              tag = f'v{major}.{minor}.{patch + 1}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={tag[1:]}\nexisting={str(bool(matching)).lower()}\n')
          PY
      - name: Build release application
        env:
          PODOKONNIK_VERSION: ${{ steps.version.outputs.version }}
        run: bash Scripts/build.sh
      - name: Package release
        run: bash Scripts/package-dmg.sh
      - name: Sign update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Scripts/create-appcast.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.version.outputs.existing }}
        run: |
          if [[ "$TAG_EXISTS" == false ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" == false ]]; then
              echo "Release $RELEASE_TAG already exists."
              exit 0
            fi
            echo "Draft release $RELEASE_TAG exists; finish or remove it before retrying." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Podokonnik-$RELEASE_VERSION-arm64.dmg" \
            "dist/Podokonnik-$RELEASE_VERSION-arm64.dmg.sha256" \
            "dist/appcast.xml" \
            --verify-tag --title "Podokonnik $RELEASE_VERSION" --generate-notes
